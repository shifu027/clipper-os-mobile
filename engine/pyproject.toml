[project]
name = "clipper-engine"
version = "0.1.0"
description = "Motor local de cortes virais do Clipper OS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "faster-whisper>=1.1",
  "google-genai>=1.0",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10.4",
  "yt-dlp[default]>=2026.10",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
clipper = "clipper_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
